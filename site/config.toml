base_url = "https://hupe1980.github.io/eebus"
title = "eebus"
description = "An unofficial EEBUS implementation in Rust: the SHIP transport, the SPINE information model, and the grid use cases behind Germany's §14a EnWG."
default_language = "en"
compile_sass = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
generate_feeds = false
minify_html = true
author = "hupe1980"

taxonomies = []

[markdown]
smart_punctuation = false
render_emoji = false
external_links_target_blank = true
external_links_no_referrer = true
bottom_footnotes = true
insert_anchor_links = "heading"

[markdown.highlighting]
style = "class"
light_theme = "ayu-light"
dark_theme = "ayu-dark"
add_color_scheme = true

[link_checker]
# The crate is not published yet, so docs.rs has nothing to serve.
skip_prefixes = ["https://docs.rs/eebus", "https://crates.io/crates/eebus"]

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
repo = "https://github.com/hupe1980/eebus"
crate = "https://crates.io/crates/eebus"
apidocs = "https://docs.rs/eebus"
tagline = "EEBUS for Rust"
og_image = "og.png"
