name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The fuzzers want wall-clock time, not a pull request.
    - cron: "17 3 * * *"
  # `release.yml` runs this same gate before it publishes: a release is not the place to
  # lower the bar, and a second copy of the matrix is a second copy to keep in step.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--workspace`, so the code generator in `xtask/` is compiled and its tests run.
      # It is what the committed model is produced by; a generator nothing builds is a
      # generator that has already drifted.
      - run: cargo test --workspace --all-features
      # Feature-scoped, so package-scoped: `xtask` has no features to select.
      - run: cargo test -p eebus --no-default-features --features std
      # The examples are the end-to-end checks: a control box limits a heat pump,
      # first against a virtual clock and then over a real socket.
      - run: cargo run --example grid_limit
      - run: cargo run --example networked --features runtime

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # `fuzz/` is a workspace of its own, so nothing above compiles it — and a change to
      # a public type breaks the fuzz targets silently until the nightly job runs. This
      # catches that in seconds; the fuzzing itself still happens below.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # The crate promises a minimum supported Rust version; a promise nothing checks is a
  # promise that has already been broken.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The promise is about the published crate, so it is the published crate that is
      # checked: `xtask` is a development tool and never leaves the repository.
      - run: cargo check -p eebus --all-features --all-targets

  # Everything the crate parses arrives from the local network, so every parser gets a
  # coverage-guided engine pointed at it. On a pull request this is a short smoke run;
  # the nightly schedule is where the real time goes.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: Seed the corpora from the specification's own examples
        run: |
          mkdir -p fuzz/corpus/spine_datagram fuzz/corpus/spine_engine
          cp tests/fixtures/spine/*.json fuzz/corpus/spine_datagram/
          cp tests/fixtures/spine/*.json fuzz/corpus/spine_engine/
      - name: Fuzz
        run: |
          seconds=$([ "${{ github.event_name }}" = "schedule" ] && echo 600 || echo 60)
          for target in ship_frame spine_datagram ship_qr ship_txt spine_engine; do
            cargo fuzz run "$target" -- -max_total_time=$seconds
          done
      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # The protocol core carries no dependency on an operating system, so it has to keep
  # building for a bare-metal target.
  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf
