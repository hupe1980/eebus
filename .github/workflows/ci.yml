name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The fuzzers want wall-clock time, not a pull request.
    - cron: "17 3 * * *"
  # `release.yml` runs this same gate before it publishes: a release is not the place to
  # lower the bar, and a second copy of the matrix is a second copy to keep in step.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--workspace`, so the code generator in `xtask/` is compiled and its tests run.
      # It is what the committed model is produced by; a generator nothing builds is a
      # generator that has already drifted.
      #
      # `--features eebus/full` rather than `--all-features`: `ring` and `aws-lc-rs` are
      # mutually exclusive, so "everything" is not a configuration that can exist. `full`
      # is everything plus `ring`.
      - run: cargo test --workspace --features eebus/full
      # Feature-scoped, so package-scoped: `xtask` has no features to select.
      - run: cargo test -p eebus --no-default-features --features std
      # The other provider, which is the one a consumer that bans `ring` reaches for.
      # The whole suite runs on it, not just a type-check: the provider decides which cipher
      # suites and key-exchange groups a SHIP handshake offers, and `ship_provider` drops
      # `aws-lc-rs`' post-quantum hybrids because a SHIP node may not negotiate one. A
      # behaviour difference there is a handshake that fails against one vendor's firmware
      # and nobody else's, which is exactly what a type-check cannot find.
      - run: cargo test -p eebus --no-default-features --features std,pairing,conformance,cert,tls,runtime,mdns,aws-lc-rs
      # Getting the provider wrong has to fail at build time rather than at the first
      # connection, which is the whole reason the choice is a feature and not a default.
      - name: A build with no provider is refused
        run: |
          if cargo check -p eebus --no-default-features --features std,tls; then
            echo "::error::tls without a cryptography provider must not compile"
            exit 1
          fi
      - name: A build with both providers is refused
        run: |
          if cargo check -p eebus --no-default-features --features std,tls,ring,aws-lc-rs; then
            echo "::error::two providers in one binary must not compile"
            exit 1
          fi
      # The examples are the end-to-end checks: a control box limits a heat pump,
      # first against a virtual clock and then over a real socket.
      - run: cargo run --example grid_limit
      - run: cargo run --example networked --features runtime,ring

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features eebus/full
      # Two defects reached the wire conversion and both were hand-rolled float
      # arithmetic — a power of ten built by multiplication, and an `as i64` that
      # saturated. Every test passed; the arithmetic was what was wrong. This bans the
      # shape from the two directories where the wire meets a number.
      - run: cargo run -p xtask -- check-floats
      # The Restricted Function Exchange table is what `possibleOperations` is derived from
      # and the first thing an integrator asks about, so it is published as a page — and a
      # published page generated from committed source is only true while it is current.
      - name: The published RFE table is current
        run: |
          cargo run -p xtask -- rfe-table
          git diff --exit-code -- site/content/docs/functions.md
      # `fuzz/` is a workspace of its own, so nothing above compiles it — and a change to
      # a public type breaks the fuzz targets silently until the nightly job runs. This
      # catches that in seconds; the fuzzing itself still happens below.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features full

  # The crate promises a minimum supported Rust version; a promise nothing checks is a
  # promise that has already been broken.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The promise is about the published crate, so it is the published crate that is
      # checked: `xtask` is a development tool and never leaves the repository.
      - run: cargo check -p eebus --features full --all-targets

  # Everything the crate parses arrives from the local network, so every parser gets a
  # coverage-guided engine pointed at it. On a pull request this is a short smoke run;
  # the nightly schedule is where the real time goes.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Two sources, and both matter. The specification's examples are the shapes a
      # conforming peer produces; the device captures are the shapes real hardware
      # actually produces, which is not the same set.
      - name: Seed the corpora from the specification and from real devices
        run: |
          mkdir -p fuzz/corpus/spine_datagram fuzz/corpus/spine_engine
          cp tests/fixtures/spine/*.json fuzz/corpus/spine_datagram/
          cp tests/fixtures/spine/*.json fuzz/corpus/spine_engine/
          cp tests/fixtures/devices/*.json fuzz/corpus/spine_datagram/
          cp tests/fixtures/devices/*.json fuzz/corpus/spine_engine/
      - name: Fuzz
        run: |
          seconds=$([ "${{ github.event_name }}" = "schedule" ] && echo 600 || echo 60)
          for target in ship_frame spine_datagram ship_qr ship_txt spine_engine; do
            cargo fuzz run "$target" -- -max_total_time=$seconds
          done
      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # The one test that talks to something this project did not write. Its own job, because
  # it needs Docker and pulls a Go toolchain: a contributor without either is not blocked,
  # and a registry outage does not redden an unrelated pull request. The peer's revision is
  # pinned, so a failure here means "we broke" rather than "they changed".
  interop:
    name: Against eebus-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features interop,full --test interop -- --nocapture

  # The protocol core carries no dependency on an operating system, so it has to keep
  # building for a bare-metal target.
  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf
