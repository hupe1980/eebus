[workspace]
members = ["xtask"]
# `fuzz/` is a workspace of its own: `cargo fuzz` builds it with its own flags, and a
# member here would pull `libfuzzer-sys` into every ordinary `cargo build`.
exclude = ["fuzz"]

[package]
name = "eebus"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Unofficial EEBUS (SHIP + SPINE + Use Cases) protocol implementation in Rust"
repository = "https://github.com/hupe1980/eebus"
homepage = "https://github.com/hupe1980/eebus"
documentation = "https://docs.rs/eebus"
keywords = ["eebus", "ship", "spine", "energy", "smart-home"]
categories = ["network-programming", "embedded", "encoding"]
readme = "README.md"
exclude = ["specs/", "site/", "xtask/"]

[features]
default = ["std", "pairing", "conformance"]
std = ["serde/std", "serde_json/std", "thiserror/std"]
# The SHIP Pairing Service: automated trust establishment from a QR-code secret.
pairing = ["dep:hmac", "dep:sha2"]
# The four High-Level Test Specifications as data: 203 abstract test cases with their
# descriptions and requirements. A few tens of kilobytes of static strings that a device
# in the field never reads, so a firmware build leaves it out — `--no-default-features`
# already does. Certification work, and `tests/conformance.rs`, need it.
conformance = []
# Cross-implementation tests against a containerised `eebus-go` peer. Off by default and
# behind `required-features` on the test target: an ordinary `cargo test` stays hermetic,
# needs no Docker and no network, and finishes in seconds.
interop = []

# The cryptography provider. `rustls`' is process-global, so the choice belongs to whoever
# builds the binary: `cert`, `tls` and `runtime` require exactly one of these two, and
# `src/lib.rs` refuses a build that names both or neither.
ring = ["rustls?/ring", "tokio-rustls?/ring", "rcgen?/ring"]
aws-lc-rs = ["rustls?/aws_lc_rs", "tokio-rustls?/aws_lc_rs", "rcgen?/aws_lc_rs"]

# Certificates: generating a node's own, and reading a peer's SKI out of one.
# Needs a provider: `--features cert,ring` or `--features cert,aws-lc-rs`.
cert = ["std", "dep:rcgen", "dep:x509-parser", "dep:sha1", "dep:time"]
# TLS 1.2 as SHIP §9 mandates, with the trust decision deferred to the SHIP handshake.
tls = ["cert", "dep:rustls"]
# Sockets: TCP, TLS and WebSocket on Tokio, driving the sans-IO cores.
runtime = ["tls", "dep:tokio", "dep:tokio-rustls", "dep:tokio-tungstenite", "dep:futures-util"]
# mDNS-SD: announcing `_ship._tcp` and finding the peers that announce it.
mdns = ["std", "dep:mdns-sd"]

# Everything, on `ring`. `--all-features` cannot work — the two providers are mutually
# exclusive — so this is what CI and docs.rs build.
full = ["std", "pairing", "conformance", "cert", "tls", "runtime", "mdns", "ring"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
hmac = { version = "0.12", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
# No provider here: `crypto` comes with whichever of `ring`/`aws_lc_rs` the consumer picks.
rcgen = { version = "0.14", default-features = false, features = ["pem"], optional = true }
x509-parser = { version = "0.18", optional = true }
sha1 = { version = "0.10", default-features = false, optional = true }
time = { version = "0.3", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
tokio = { version = "1", default-features = false, features = ["net", "rt", "time", "macros", "sync", "io-util"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
mdns-sd = { version = "0.21", default-features = false, optional = true }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

# The sans-IO example needs nothing; the networked one needs a socket.
# The cross-implementation suite. `required-features` is what keeps it out of an
# ordinary `cargo test`; it is not part of `full`, because "everything" should not mean
# "needs Docker".
[[test]]
name = "interop"
required-features = ["interop", "runtime", "ring"]

[[example]]
name = "grid_limit"

[[example]]
name = "networked"
required-features = ["runtime"]

# The two simulators: a control box and a household appliance, on a real network.
[[example]]
name = "steuerbox"
required-features = ["runtime", "mdns"]

[[example]]
name = "heat_pump"
required-features = ["runtime", "mdns"]

[package.metadata.docs.rs]
# Not `all-features`: `ring` and `aws-lc-rs` are mutually exclusive by design, so
# "everything" is not a valid configuration. This is everything plus one provider.
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
